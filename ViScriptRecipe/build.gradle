plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge'
    id 'io.freefair.lombok'
}

version = mod_version
group = mod_group_id

repositories {
    // Player Animator
    maven {
        name = "KosmX"
        url = "https://maven.kosmx.dev/"
        content {
            includeGroup "dev.kosmx.player-anim"
        }
    }

    maven {
        name = "Iron's Maven"
        url = "https://code.redspace.io/releases"
    }

    // Create
    maven {
        name = "Create"
        url = "https://maven.createmod.net"
    }
    maven {
        name = "Registrate"
        url = "https://maven.ithundxr.dev/snapshots"
    }
}

base {
    archivesName = "${mod_name}-forge-${minecraft_version}"
}

configurations.configureEach {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

legacyForge {
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
            var file = file("../runs/client")
            if (!file.exists()) file.mkdirs()
            setGameDirectory file
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
            var file = file("../runs/server")
            if (!file.exists()) file.mkdirs()
            setGameDirectory file
        }

        // applies to all the run configs above
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    implementation project(":ViScriptLib")
    jarJar(project(":ViScriptLib"))

    // Optional
    //铁魔法
